name: Daily edition

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC every day (06:15 Dublin in winter, 07:15 in summer)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build today's edition
        run: python build.py
      - name: Commit and publish
        run: |
          git config user.name "newsroom-bot"
          git config user.email "newsroom-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Edition $(date -u +%F)"
          git push
